name: Build

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: ./gradlew :patches:buildAndroid

      - uses: actions/upload-artifact@v4
        with:
          name: patches
          path: patches/build/libs/patches-*.mpp
